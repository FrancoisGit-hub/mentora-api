# Defines the "Connection" header value to send to the upstream API.
# - When the client requests a WebSocket upgrade (e.g. SignalR /hubs/chat),
#   $http_upgrade is "websocket" → we set Connection: upgrade.
# - Otherwise → we set Connection: keep-alive for regular REST calls.
map $http_upgrade $connection_upgrade {
    default keep-alive;
    ''      keep-alive;
    websocket upgrade;
}

# ---------------------------------------------------------------------------
# HTTP server — serves ACME challenges (renewals) AND redirects everything
# else to HTTPS.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name api-demo.mentorapp.fr 87.106.108.91;

    # Let's Encrypt ACME challenge — served over HTTP for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Everything else → 301 redirect to HTTPS.
    location / {
        return 301 https://api-demo.mentorapp.fr$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS server — actual application traffic.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api-demo.mentorapp.fr;

    # Increase max body size for future file uploads (default 1MB is too low).
    client_max_body_size 25M;

    # Let's Encrypt certificate paths (mounted from host via docker-compose).
    ssl_certificate     /etc/letsencrypt/live/api-demo.mentorapp.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-demo.mentorapp.fr/privkey.pem;

    # Modern TLS profile (Mozilla intermediate, 2024+).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — force HTTPS on this domain for 6 months.
    # Only enable after confirming the setup works end-to-end.
    add_header Strict-Transport-Security "max-age=15768000" always;

    # SignalR Hub — explicit WebSocket support (wss:// over HTTPS).
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets stay open — disable buffering and bump timeouts.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # All other REST routes (catch-all).
    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
