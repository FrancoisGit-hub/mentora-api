# Defines the "Connection" header value to send to the upstream API.
# - When the client requests a WebSocket upgrade (e.g. SignalR /hubs/chat),
#   $http_upgrade is "websocket" → we set Connection: upgrade.
# - Otherwise → we set Connection: keep-alive for regular REST calls.
map $http_upgrade $connection_upgrade {
    default keep-alive;
    ''      keep-alive;
    websocket upgrade;
}

server {
    listen 80;
    server_name 87.106.108.91 api-demo.mentorapp.fr;

    # Increase max body size for future file uploads (default 1MB is too low).
    client_max_body_size 25M;

    # SignalR Hub — explicit WebSocket support.
    # Must be declared BEFORE the catch-all location / block.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets stay open — disable buffering and bump timeouts.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # All other REST routes (catch-all).
    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}